<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" width="800" height="640">
<defs>
    <linearGradient id="bg-nrstory" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1B6B6D"/>
      <stop offset="100%" stop-color="#165858"/>
    </linearGradient>
    <pattern id="weave-nrstory" patternUnits="userSpaceOnUse" width="16" height="16" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="16" stroke="rgba(255,255,255,0.06)" stroke-width="0.7"/>
      <line x1="8" y1="0" x2="8" y2="16" stroke="rgba(0,0,0,0.03)" stroke-width="0.4"/>
    </pattern>
    <pattern id="weave-nrstory-h" patternUnits="userSpaceOnUse" width="18" height="18" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="18" stroke="rgba(255,255,255,0.05)" stroke-width="0.5"/>
      <line x1="9" y1="0" x2="9" y2="18" stroke="rgba(0,0,0,0.02)" stroke-width="0.4"/>
    </pattern>
</defs>

  <rect width="800" height="640" fill="url(#bg-nrstory)"/>
  <rect width="800" height="640" fill="url(#weave-nrstory)"/>
  <rect width="800" height="640" fill="url(#weave-nrstory-h)" opacity="0.6"/>

  <!-- Fabric swatch area -->
  <rect x="60" y="60" width="680" height="420" fill="rgba(255,255,255,0.025)" stroke="rgba(255,255,255,0.05)" stroke-width="0.8"/>

  <!-- Horizontal weave lines -->
  <line x1="60" y1="120" x2="740" y2="120" stroke="rgba(255,255,255,0.035)" stroke-width="0.5"/>
  <line x1="60" y1="160" x2="740" y2="160" stroke="rgba(255,255,255,0.03)" stroke-width="0.5"/>
  <line x1="60" y1="200" x2="740" y2="200" stroke="rgba(255,255,255,0.035)" stroke-width="0.5"/>
  <line x1="60" y1="240" x2="740" y2="240" stroke="rgba(255,255,255,0.03)" stroke-width="0.5"/>
  <line x1="60" y1="280" x2="740" y2="280" stroke="rgba(255,255,255,0.035)" stroke-width="0.5"/>
  <line x1="60" y1="320" x2="740" y2="320" stroke="rgba(255,255,255,0.03)" stroke-width="0.5"/>
  <line x1="60" y1="360" x2="740" y2="360" stroke="rgba(255,255,255,0.035)" stroke-width="0.5"/>
  <line x1="60" y1="400" x2="740" y2="400" stroke="rgba(255,255,255,0.03)" stroke-width="0.5"/>
  <line x1="60" y1="440" x2="740" y2="440" stroke="rgba(255,255,255,0.035)" stroke-width="0.5"/>

  <!-- Vertical weave lines -->
  <line x1="140" y1="60" x2="140" y2="480" stroke="rgba(255,255,255,0.025)" stroke-width="0.4"/>
  <line x1="220" y1="60" x2="220" y2="480" stroke="rgba(255,255,255,0.025)" stroke-width="0.4"/>
  <line x1="300" y1="60" x2="300" y2="480" stroke="rgba(255,255,255,0.025)" stroke-width="0.4"/>
  <line x1="380" y1="60" x2="380" y2="480" stroke="rgba(255,255,255,0.025)" stroke-width="0.4"/>
  <line x1="460" y1="60" x2="460" y2="480" stroke="rgba(255,255,255,0.025)" stroke-width="0.4"/>
  <line x1="540" y1="60" x2="540" y2="480" stroke="rgba(255,255,255,0.025)" stroke-width="0.4"/>
  <line x1="620" y1="60" x2="620" y2="480" stroke="rgba(255,255,255,0.025)" stroke-width="0.4"/>
  <line x1="700" y1="60" x2="700" y2="480" stroke="rgba(255,255,255,0.025)" stroke-width="0.4"/>

  <!-- OceanCycle badge -->
  <circle cx="660" cy="140" r="40" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="0.8"/>
  <text x="660" y="137" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="8" letter-spacing="1" fill="rgba(255,255,255,0.35)" text-anchor="middle" font-variant="small-caps">OCEAN</text>
  <text x="660" y="148" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="8" letter-spacing="1" fill="rgba(255,255,255,0.35)" text-anchor="middle" font-variant="small-caps">CYCLE</text>

  <line x1="100" y1="568" x2="700" y2="568" stroke="#E07B12" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <text x="400" y="548" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="300" fill="rgba(255,255,255,0.45)" text-anchor="middle" letter-spacing="3">NERIO</text>
  <text x="400" y="600" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" letter-spacing="3" fill="rgba(255,255,255,0.25)" text-anchor="middle" font-variant="small-caps">MOSAROMA</text>
</svg>
